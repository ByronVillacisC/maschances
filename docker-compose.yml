services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/pluschances.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/var/www/pluschances/frontend/dist
      - ./letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: .
    command: ["node", "src/main.js"]
    ports:
      - "4000:4000"  # ← AGREGADO
    env_file: ./.env
    environment:
      - PORT=4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "src/workers/worker.main.js"]
    env_file: ./.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pluschances
      POSTGRES_USER: pluschances_user
      POSTGRES_PASSWORD: SECURE_PASSWORD
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pluschances_user -d pluschances"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata: